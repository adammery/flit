[package]
name = "flit"
version = "0.3.0"
description = "A minimal, privacy-first desktop email client"
authors = ["Dominik Mery"]
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/dommer1/flit"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "flit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# why: sqlite-bundled statically vendors libsqlite3 so the app doesn't depend
# on the system SQLite version; runtime-tokio matches Tauri's async runtime.
sqlx = { version = "0.9", features = ["runtime-tokio", "sqlite-bundled", "json"] }
tauri-plugin-dialog = "2"
keyring = "4"
thiserror = "2"
# why: rt is needed for task::spawn_blocking (keychain calls are sync and must
# not block the async executor); net/time for IMAP TCP connects with timeouts;
# fs for reading attachment files without blocking; process for the afplay
# sound preview; macros is compile-time only (#[tokio::test]).
tokio = { version = "1", features = ["rt", "macros", "net", "time", "fs", "process"] }
# why: async-imap defaults to async-std — runtime-tokio must be selected
# explicitly. It has no TLS of its own; async-native-tls wraps the TCP stream
# first (macOS SecureTransport, so system cert store just works).
async-imap = { version = "0.11", default-features = false, features = ["runtime-tokio"] }
async-native-tls = { version = "0.6", default-features = false, features = ["runtime-tokio"] }
mail-parser = "0.11"
ammonia = "4"
# why: async-imap fetch results arrive as a Stream; futures provides the
# collect combinators.
futures = "0.3"
lettre = { version = "0.11", default-features = false, features = [
    "smtp-transport",
    "tokio1",
    "tokio1-native-tls",
    "builder",
] }
# why: attachment Content-Type comes from the filename extension; recipients'
# clients pick preview/open behavior from it.
mime_guess = "2"
# why: compose-window attachment thumbnails. Only the formats we preview
# compile in — anything else simply gets no thumbnail.
image = { version = "0.25", default-features = false, features = [
    "png",
    "jpeg",
    "webp",
] }
# why: typo-tolerant search. strsim measures how far a typed word is from
# the words the index holds; unicode-normalization strips diacritics the way
# the index does, so both sides are compared in the same form. Both were
# already in the tree.
strsim = "0.11"
unicode-normalization = "0.1"
utf7-imap = "0.3.2"
base64 = "0.22.1"
reqwest = { version = "0.13.4", default-features = false, features = ["native-tls"] }
# why: a downloaded model file is hashed on the way down and checked against
# the catalog pin before it is ever loaded (already in the tree via sqlx).
sha2 = "0.10"
# why: the on-device summaries engine. Thin bindings over llama.cpp, built
# from source (needs cmake); on Apple Silicon the crate turns Metal on by
# itself. default-features off drops llama.cpp's `common` library (~14 MB
# we never call) and OpenMP, which Apple's clang does not ship.
llama-cpp-2 = { version = "0.1.156", default-features = false }
# why: llama-cpp-2 hands tokens back through an encoding_rs UTF-8 decoder, so
# a multi-byte character split across tokens still comes out whole.
encoding_rs = "0.8"
# why: a small model asked to "write in the language of the message" answers
# in English anyway; told "write in Slovak" it complies. Offline trigram
# detection, no data files, MIT.
whatlang = "0.18"
lightningcss = { version = "=1.0.0-alpha.71", default-features = false }
# why: the tokenizer lightningcss parses with (same version, already in the
# tree through it). mail::css measures a stylesheet's nesting depth with it
# before handing the sheet to lightningcss, whose recursion has no limit.
cssparser = "0.33"
mail-builder = "0.4"
# why: native new-mail notifications, sent from the Rust sync path only —
# the webview never gets the notification IPC permission.
# why: avatars are looked up by registrable domain ("example.co.uk" for
# "mail.example.co.uk"), which only the Public Suffix List can tell. The list
# is compiled in — no data file, no network. MIT/Apache-2.0.
psl = "2"
tauri-plugin-notification = "2.3.3"
tauri-plugin-opener = "2.5.4"
oauth2 = { version = "5", default-features = false }

# why: a desktop binary is built once and shipped many times, so the slower
# release compile buys a smaller, faster app: lto and one codegen unit let
# the optimiser see the whole program, strip drops symbols nobody ships.
[profile.release]
lto = true
codegen-units = 1
strip = true

# why: without this, `strip` above also applies to build-time proc-macro
# dylibs (sqlx-macros here) — rustc dlopen's those the moment they're built,
# in the same process, and stripping them post-link deterministically
# corrupts the Mach-O LINKEDIT string table on this toolchain (dyld then
# refuses to dlopen it: "mis-aligned LINKEDIT string pool"). Proc-macro
# crates never ship in the app bundle, so there's nothing to gain from
# stripping or optimizing them anyway.
[profile.release.build-override]
opt-level = 0
strip = false
